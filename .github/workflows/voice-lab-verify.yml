name: Voice conversation lab verification
on:
  pull_request:
    paths:
      - 'public/voice-lab/**'
      - 'functions/voice/**'
      - 'scripts/verify-voice-lab.mjs'
      - '.github/workflows/voice-lab-verify.yml'
  push:
    paths:
      - 'public/voice-lab/**'
      - 'functions/voice/**'
      - 'scripts/verify-voice-lab.mjs'
      - '.github/workflows/voice-lab-verify.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/verify-voice-lab.mjs
      - run: npm install --no-package-lock --no-audit --no-fund
      - run: npm run build
      - run: test -f _site/voice-lab/index.html
