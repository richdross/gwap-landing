name: Cloudflare Core Verify

on:
  pull_request:
    branches: [main]
  push:
    branches: [architecture/cloudflare-core-v1]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Verify public Worker syntax and Wrangler config
        run: npm run verify

      - name: Verify intelligence Worker syntax
        if: ${{ hashFiles('platform/intelligence/src/worker.js') != '' }}
        run: node --check platform/intelligence/src/worker.js
