name: GWAP Signal Sniper Sources

on:
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'
  push:
    branches:
      - architecture/cloudflare-core-v1
    paths:
      - '.github/workflows/signal-sniper-sources.yml'
      - 'platform/intelligence/scripts/trends-collector.mjs'
      - 'platform/intelligence/scripts/youtube-collector.mjs'
      - 'platform/intelligence/scripts/ga4-collector.mjs'
      - 'platform/intelligence/src/worker.js'
      - 'platform/intelligence/src/sniper.js'

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      GA4_PROPERTY_ID: '550617706'
      GA4_SERVICE_ACCOUNT_JSON: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}
      INTELLIGENCE_URL: https://gwap-intelligence-v1.richdross.workers.dev
      SNIPER_GEO: US

    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4
        with:
          ref: architecture/cloudflare-core-v1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Derive protected ingest key
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN is missing"
            exit 2
          fi
          key=$(printf 'gwap-signal-ingest-v1:%s' "$CLOUDFLARE_API_TOKEN" | sha256sum | awk '{print $1}')
          echo "SIGNAL_INGEST_KEY=$key" >> "$GITHUB_ENV"

      - name: Check YouTube credential
        shell: bash
        run: |
          if [ -z "$YOUTUBE_API_KEY" ]; then
            echo "YOUTUBE_API_KEY is missing"
            exit 2
          fi

      - name: Collect Google Trends into GWAP
        id: trends
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node platform/intelligence/scripts/trends-collector.mjs | tee trends-result.json

      - name: Collect YouTube into GWAP
        id: youtube
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node platform/intelligence/scripts/youtube-collector.mjs | tee youtube-result.json

      - name: Collect GA4 behavior into GWAP
        id: ga4
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node platform/intelligence/scripts/ga4-collector.mjs 2>&1 | tee ga4-result.json

      - name: Compare signals and find convergence
        id: compare
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          code=$(curl -sS -o convergence-result.json -w "%{http_code}" \
            -X POST "$INTELLIGENCE_URL/sniper/compare" \
            -H "content-type: application/json" \
            -H "x-gwap-ingest-key: $SIGNAL_INGEST_KEY" \
            --data '{}')
          cat convergence-result.json
          echo "HTTP $code" > convergence-http.txt
          if [ "$code" != "200" ]; then exit 4; fi

      - name: Write source proof report
        if: always()
        shell: bash
        run: |
          {
            echo "## GWAP Signal Sniper Source Report"
            echo
            echo "Commit: $GITHUB_SHA"
            echo "Trends step: ${{ steps.trends.outcome }}"
            echo "YouTube step: ${{ steps.youtube.outcome }}"
            echo "GA4 step: ${{ steps.ga4.outcome }}"
            echo "Convergence step: ${{ steps.compare.outcome }}"
            echo
            if [ -f trends-result.json ]; then
              echo "### Google Trends"
              echo '```json'
              cat trends-result.json
              echo '```'
            fi
            if [ -f youtube-result.json ]; then
              echo "### YouTube"
              echo '```json'
              cat youtube-result.json
              echo '```'
            fi
            if [ -f ga4-result.json ]; then
              echo "### GA4"
              echo '```text'
              cat ga4-result.json
              echo '```'
            fi
            if [ -f convergence-result.json ]; then
              echo "### Convergence"
              echo '```json'
              cat convergence-result.json
              echo '```'
            fi
            if [ -f convergence-http.txt ]; then cat convergence-http.txt; fi
            echo
            echo "Production routes were not changed."
          } > source-report.md

      - name: Publish source report to PR #1
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh pr comment 1 --body-file source-report.md

      - name: Upload collector proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: signal-sniper-sources-${{ github.run_id }}
          path: |
            trends-result.json
            youtube-result.json
            ga4-result.json
            convergence-result.json
            source-report.md
          if-no-files-found: warn
          retention-days: 7

# GA4 proof trigger: service-account credential installed 2026-08-18
