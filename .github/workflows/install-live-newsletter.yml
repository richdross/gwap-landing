name: Install live newsletter capture

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/install-live-newsletter.yml"

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Inject functional newsletter module without altering existing design
        shell: python
        run: |
          from pathlib import Path

          path = Path("index.html")
          html = path.read_text(encoding="utf-8")
          marker = "GWAP_LIVE_NEWSLETTER_V1"
          if marker in html:
              print("Newsletter module already installed.")
              raise SystemExit(0)

          block = r'''
<!-- GWAP_LIVE_NEWSLETTER_V1 -->
<section id="gwap-newsletter-live" aria-label="The Leverage Brief newsletter">
  <style>
    #gwap-newsletter-live{box-sizing:border-box;background:#050505;color:#f4f2ec;border-top:1px solid #333832;border-bottom:1px solid #333832;padding:72px 24px;font-family:Arial,Helvetica,sans-serif}
    #gwap-newsletter-live *{box-sizing:border-box}
    #gwap-newsletter-live .gn-wrap{width:min(1180px,100%);margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,.8fr);gap:64px;align-items:end}
    #gwap-newsletter-live .gn-kicker{font:700 11px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.16em;color:#caff00;text-transform:uppercase;margin-bottom:18px}
    #gwap-newsletter-live h2{margin:0;font-family:Impact,Haettenschweiler,"Arial Narrow Bold","Arial Black",sans-serif;font-size:clamp(48px,8vw,104px);line-height:.84;letter-spacing:-.04em;text-transform:uppercase;color:#fff}
    #gwap-newsletter-live h2 span{color:#caff00}
    #gwap-newsletter-live .gn-copy{margin:26px 0 0;max-width:720px;color:#b9bdb5;font-size:17px;line-height:1.65}
    #gwap-newsletter-live .gn-points{margin:28px 0 0;padding:0;list-style:none;display:grid;grid-template-columns:1fr 1fr;gap:10px 24px;color:#e9e9e2;font:700 12px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.05em;text-transform:uppercase}
    #gwap-newsletter-live .gn-points li:before{content:"//";color:#caff00;margin-right:8px}
    #gwap-newsletter-live form{border-top:1px solid #3a3e39;padding-top:22px}
    #gwap-newsletter-live .gn-label{display:block;margin-bottom:12px;color:#8f948d;font:700 10px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.12em;text-transform:uppercase}
    #gwap-newsletter-live .gn-row{display:flex;gap:10px}
    #gwap-newsletter-live input{min-width:0;flex:1;height:58px;border:1px solid #454a44;background:#0b0c0b;color:#fff;padding:0 17px;font-size:16px;outline:none;border-radius:0}
    #gwap-newsletter-live input:focus{border-color:#caff00}
    #gwap-newsletter-live button{height:58px;border:1px solid #caff00;background:#caff00;color:#080908;padding:0 22px;font-weight:900;letter-spacing:.02em;cursor:pointer;border-radius:0;white-space:nowrap}
    #gwap-newsletter-live button:disabled{opacity:.6;cursor:wait}
    #gwap-newsletter-live .gn-status{min-height:20px;margin-top:12px;color:#81867f;font:700 10px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.08em;text-transform:uppercase}
    #gwap-newsletter-live .gn-status.ok{color:#caff00}
    #gwap-newsletter-live .gn-status.err{color:#ff6b5f}
    #gwap-newsletter-live .gn-privacy{margin-top:10px;color:#686d67;font-size:11px;line-height:1.5}
    @media(max-width:760px){
      #gwap-newsletter-live{padding:54px 18px}
      #gwap-newsletter-live .gn-wrap{grid-template-columns:1fr;gap:38px}
      #gwap-newsletter-live .gn-points{grid-template-columns:1fr}
      #gwap-newsletter-live .gn-row{flex-direction:column}
      #gwap-newsletter-live button{width:100%}
    }
  </style>
  <div class="gn-wrap">
    <div>
      <div class="gn-kicker">Gwap Gang // Editorial Intelligence</div>
      <h2>THE LEVERAGE<br><span>BRIEF.</span></h2>
      <p class="gn-copy">A field note on what is actually worth paying attention to in modern AI business—new capabilities, useful workflows, market shifts, money plays, and the systems that create leverage before they become obvious.</p>
      <ul class="gn-points">
        <li>Before It’s Obvious</li>
        <li>The Connection</li>
        <li>We Tried It</li>
        <li>The Money Play</li>
        <li>Don’t Get Cooked</li>
        <li>Gwap Guidance</li>
      </ul>
    </div>
    <form id="gwap-newsletter-form" novalidate>
      <label class="gn-label" for="gwap-newsletter-email">Get the signal in your inbox</label>
      <div class="gn-row">
        <input id="gwap-newsletter-email" name="email" type="email" autocomplete="email" inputmode="email" placeholder="Enter your email" required>
        <button id="gwap-newsletter-submit" type="submit">JOIN THE GANG →</button>
      </div>
      <div id="gwap-newsletter-status" class="gn-status" aria-live="polite">NO SPAM. JUST SIGNAL.</div>
      <div class="gn-privacy">By joining, you agree to receive The Leverage Brief from Gwap Gang. Every editorial email includes an unsubscribe option.</div>
    </form>
  </div>
  <script>
    (() => {
      const form = document.getElementById('gwap-newsletter-form');
      if (!form) return;
      const email = document.getElementById('gwap-newsletter-email');
      const button = document.getElementById('gwap-newsletter-submit');
      const status = document.getElementById('gwap-newsletter-status');

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const value = String(email.value || '').trim().toLowerCase();
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value)) {
          status.textContent = 'ENTER A VALID EMAIL TO JOIN THE SIGNAL.';
          status.className = 'gn-status err';
          return;
        }

        button.disabled = true;
        button.textContent = 'CONNECTING…';
        status.textContent = 'LOCKING ONTO THE SIGNAL…';
        status.className = 'gn-status';

        try {
          const response = await fetch('https://gwap-backend.onrender.com/newsletter/subscribe', {
            method: 'POST',
            headers: {'Content-Type':'application/json','Accept':'application/json'},
            body: JSON.stringify({email:value})
          });
          const data = await response.json().catch(() => ({}));
          if (!response.ok || !data.ok) throw new Error('signup_failed');

          status.textContent = data.created
            ? 'ACCESS GRANTED // CHECK YOUR INBOX.'
            : 'YOU’RE ALREADY IN // SIGNAL CONFIRMED.';
          status.className = 'gn-status ok';
          email.disabled = true;
          button.textContent = 'YOU’RE IN';
        } catch (error) {
          status.textContent = 'SIGNAL INTERRUPTED // TRY AGAIN.';
          status.className = 'gn-status err';
          button.disabled = false;
          button.textContent = 'JOIN THE GANG →';
        }
      });
    })();
  </script>
</section>
<!-- /GWAP_LIVE_NEWSLETTER_V1 -->
'''

          needle = "</body>"
          if needle.lower() not in html.lower():
              raise SystemExit("index.html has no closing body tag")

          idx = html.lower().rfind(needle)
          html = html[:idx] + block + "\n" + html[idx:]
          path.write_text(html, encoding="utf-8")
          print("Installed live newsletter module.")
      - name: Commit production newsletter module
        run: |
          if git diff --quiet -- index.html; then
            echo "No changes required."
            exit 0
          fi
          git config user.name "Gwap Gang Production Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "Make Gwap Gang landing newsletter signup live"
          git push origin HEAD:main
