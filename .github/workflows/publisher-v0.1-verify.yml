name: GWAP Publisher V0.1 Verify

on:
  pull_request:
    paths:
      - '.eleventy.js'
      - '.pages.yml'
      - '_data/**'
      - 'package.json'
      - '_includes/**'
      - 'blog/**'
      - 'content/blog/**'
      - 'author/**'
      - 'feed.njk'
      - 'sitemap.njk'
      - 'robots.txt'
      - 'public/robots.txt'
      - 'public/images/blog/**'
      - '.github/workflows/publisher-v0.1-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Eleventy
        run: npm install --no-audit --no-fund

      - name: Build site
        run: npm run build

      - name: Verify publishing outputs
        shell: bash
        run: |
          set -euxo pipefail

          ARTICLE="_site/blog/the-new-gatekeepers-of-ai-commerce-why-agent-access-is-becoming-the-real-power-layer/index.html"
          BRIEF="_site/brief/002-ai-agents-can-be-powerful-and-still-get-locked-out/index.html"
          ARTICLE_URL="https://gwapgang.com/blog/the-new-gatekeepers-of-ai-commerce-why-agent-access-is-becoming-the-real-power-layer/"
          ARTICLE_SLUG="the-new-gatekeepers-of-ai-commerce-why-agent-access-is-becoming-the-real-power-layer"

          test -f _site/index.html
          test -f _site/blog/index.html
          test -f "$ARTICLE"
          test -f "$BRIEF"
          test -f _site/feed.xml
          test -f _site/sitemap.xml
          test -f _site/robots.txt

          grep -q 'Creative Technology for Business' _site/index.html
          grep -q 'GWAP Blog — GWAP Gang' _site/blog/index.html

          grep -q 'max-image-preview:large' "$ARTICLE"
          grep -q "rel=\"canonical\" href=\"$ARTICLE_URL\"" "$ARTICLE"
          grep -q 'property="og:type" content="article"' "$ARTICLE"
          grep -q 'property="article:modified_time"' "$ARTICLE"
          grep -q 'google-add-preferred-source-btn' "$ARTICLE"
          grep -q 'news.google.com/swg/js/v1/publisher.js' "$ARTICLE"
          grep -q 'data-gwap-event="article_cta_click"' "$ARTICLE"
          grep -q 'article_view' "$ARTICLE"
          grep -q 'article_scroll_50' "$ARTICLE"
          grep -q 'G-MZF7SR86XK' "$ARTICLE"
          grep -q 'Was this useful?' "$ARTICLE"
          grep -q 'Share this intelligence' "$ARTICLE"
          grep -q 'reading-progress' "$ARTICLE"
          grep -q 'article_read_depth' "$ARTICLE"
          grep -q 'article_completed' "$ARTICLE"
          grep -q 'article_feedback' "$ARTICLE"
          grep -q 'article_share' "$ARTICLE"
          grep -q 'article_link_click' "$ARTICLE"

          grep -q 'User-agent: OAI-SearchBot' _site/robots.txt
          grep -q 'User-agent: Googlebot' _site/robots.txt
          grep -q 'User-agent: Bingbot' _site/robots.txt
          grep -q "$ARTICLE_SLUG" _site/sitemap.xml
          grep -q 'The New Gatekeepers of AI Commerce' _site/feed.xml
          grep -q 'AI Agents Can Be Powerful' "$BRIEF"

          node <<'NODE'
          const fs = require("fs");
          const articlePath = "_site/blog/the-new-gatekeepers-of-ai-commerce-why-agent-access-is-becoming-the-real-power-layer/index.html";
          const html = fs.readFileSync(articlePath, "utf8");
          const blocks = [...html.matchAll(/<script type="application\/ld\+json">\s*([\s\S]*?)\s*<\/script>/g)];
          if (!blocks.length) throw new Error("No JSON-LD block found");

          const documents = blocks.map((match) => JSON.parse(match[1]));
          const graph = documents.flatMap((doc) => Array.isArray(doc["@graph"]) ? doc["@graph"] : [doc]);
          const getType = (type) => graph.find((node) => node && node["@type"] === type);

          const organization = getType("Organization");
          const person = getType("Person");
          const breadcrumbs = getType("BreadcrumbList");
          const article = getType("BlogPosting");
          const expectedUrl = "https://gwapgang.com/blog/the-new-gatekeepers-of-ai-commerce-why-agent-access-is-becoming-the-real-power-layer/";

          if (!organization) throw new Error("Organization schema missing");
          if (!person) throw new Error("Person schema missing");
          if (!breadcrumbs) throw new Error("BreadcrumbList schema missing");
          if (!article) throw new Error("BlogPosting schema missing");
          if (article.url !== expectedUrl) throw new Error("Article URL mismatch");
          if (article.mainEntityOfPage?.["@id"] !== expectedUrl) throw new Error("mainEntityOfPage mismatch");
          if (!article.headline || !article.description) throw new Error("Article metadata missing");
          if (!article.datePublished || !article.dateModified) throw new Error("Article dates missing");
          if (!Array.isArray(article.image) || !article.image.length) throw new Error("Article image missing");
          if (!article.author?.["@id"] || !article.publisher?.["@id"]) throw new Error("Article references missing");
          if (person.name !== "Rich Ross") throw new Error("Author name mismatch");
          if (organization.url !== "https://gwapgang.com/") throw new Error("Publisher URL mismatch");
          if (!Array.isArray(breadcrumbs.itemListElement) || breadcrumbs.itemListElement.length !== 3) {
            throw new Error("Breadcrumb structure invalid");
          }

          console.log("Current publishing engine verification PASS");
          NODE

          echo 'GWAP Publisher + Discovery + Professional Blog Engine verification PASS'
