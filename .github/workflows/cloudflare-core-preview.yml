name: Cloudflare Core Preview

on:
  push:
    branches:
      - architecture/cloudflare-core-v1
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 3acc9be3484d883bd49e2f2093560ca1

    steps:
      - name: Checkout isolated branch
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Wrangler
        run: npm install

      - name: Check Cloudflare deployment credentials
        id: auth
        shell: bash
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bootstrap public Worker service
        id: public_deploy
        if: steps.auth.outputs.ready == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          npx wrangler deploy > public-deploy.log 2>&1
          code=$?
          cat public-deploy.log
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Bootstrap intelligence Worker service
        id: intelligence_deploy
        if: steps.auth.outputs.ready == 'true'
        continue-on-error: true
        shell: bash
        run: |
          set +e
          cd platform/intelligence
          npx --yes wrangler@4 deploy > ../../intelligence-deploy.log 2>&1
          code=$?
          cd ../..
          cat intelligence-deploy.log
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Write preview report
        if: always()
        shell: bash
        run: |
          {
            echo "## GWAP Cloudflare Preview Report"
            echo
            echo "Commit: $GITHUB_SHA"
            echo "Credential gate: ${{ steps.auth.outputs.ready }}"
            echo "Public exit code: ${{ steps.public_deploy.outputs.exit_code }}"
            echo "Intelligence exit code: ${{ steps.intelligence_deploy.outputs.exit_code }}"
            echo
            if [ -f public-deploy.log ]; then
              echo "### Public Worker log"
              echo '```'
              cat public-deploy.log
              echo '```'
            fi
            if [ -f intelligence-deploy.log ]; then
              echo "### Intelligence Worker log"
              echo '```'
              cat intelligence-deploy.log
              echo '```'
            fi
            if [ "${{ steps.auth.outputs.ready }}" != "true" ]; then
              echo "BLOCKED: GitHub Actions does not currently have CLOUDFLARE_API_TOKEN."
            fi
            echo
            echo "Production routes were not changed; these are isolated workers.dev services only."
          } > preview-report.md

      - name: Publish report to PR #1
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh pr comment 1 --body-file preview-report.md
