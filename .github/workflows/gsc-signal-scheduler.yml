name: GWAP GSC Signal Scheduler

on:
  workflow_dispatch:
  schedule:
    - cron: '41 10 * * *'
  pull_request:
    paths:
      - '.github/workflows/gsc-signal-scheduler.yml'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/gsc-signal-scheduler.yml'

permissions:
  contents: read

concurrency:
  group: gwap-gsc-signal-scheduler
  cancel-in-progress: false

jobs:
  collect-gsc:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      GA4_SERVICE_ACCOUNT_JSON: ${{ secrets.GA4_SERVICE_ACCOUNT_JSON }}
      GSC_TARGET_HOST: gwapgang.com
      INTELLIGENCE_URL: https://gwap-intelligence-v1.richdross.workers.dev

    steps:
      - name: Checkout isolated collector branch
        uses: actions/checkout@v4
        with:
          ref: architecture/cloudflare-core-v1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Derive protected ingest key
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN is missing"
            exit 2
          fi
          key=$(printf 'gwap-signal-ingest-v1:%s' "$CLOUDFLARE_API_TOKEN" | sha256sum | awk '{print $1}')
          echo "SIGNAL_INGEST_KEY=$key" >> "$GITHUB_ENV"

      - name: Check Google credential
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$GA4_SERVICE_ACCOUNT_JSON" ]; then
            echo "GA4_SERVICE_ACCOUNT_JSON is missing"
            exit 2
          fi

      - name: Collect Search Console performance into GWAP
        shell: bash
        run: |
          set -euo pipefail
          node platform/intelligence/scripts/gsc-collector.mjs | tee gsc-result.json

      - name: Upload Search Console proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gsc-signal-proof-${{ github.run_id }}
          path: gsc-result.json
          if-no-files-found: warn
          retention-days: 7

# Scheduler lives on main so GitHub cron can trigger it.
# Runtime collector is isolated on architecture/cloudflare-core-v1.
