media:
  - name: blog_images
    label: Blog Images
    input: public/images/blog
    output: /images/blog
    categories: [image]
    rename: safe

content:
  - name: blog
    label: GWAP Blog
    type: collection
    path: content/blog
    filename: "{primary}.md"
    exclude: ["blog.json", ".gitkeep"]
    view:
      fields: [title, author, date]
      primary: title
      sort: [date, title]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: author
        label: Author
        type: string
        required: true
        default: "Rich — GWAP Gang"
      - name: date
        label: Publish Date
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: image
        label: Featured Image
        type: image
        required: true
        options:
          media: blog_images
          categories: [image]
          rename: safe
      - name: description
        label: Description
        type: text
        required: true
        options:
          minlength: 20
          maxlength: 240
      - name: body
        label: Blog
        type: rich-text
        required: true
        options:
          format: markdown
          media: blog_images
          rename: safe
          switcher: true

settings:
  commit:
    identity: user
    templates:
      create: "content(blog): publish {path}"
      update: "content(blog): update {path}"
      delete: "content(blog): remove {path}"
      rename: "content(blog): rename {oldPath} -> {newPath}"
